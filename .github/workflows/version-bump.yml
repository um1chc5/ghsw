name: Version bump on master

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  bump:
    # Prevent infinite loops: only bump when the push wasn't caused by our own release commit
    if: "!contains(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Bump version (patch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # No git tag; just update package.json version and commit it.
          npm version patch --no-git-tag-version

      - name: Commit & push
        run: |
          # package-lock may be ignored; package.json is what we care about.
          git add package.json || true

          # If npm version produced no changes (rare), don't fail the workflow.
          if git diff --cached --quiet; then
            echo "No version changes to commit."
            exit 0
          fi

          NEW_VER=$(node -p "require('./package.json').version")
          git commit -m "chore(release): v${NEW_VER}"
          git push origin HEAD:master

