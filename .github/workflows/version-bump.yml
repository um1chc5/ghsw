name: Version bump on master

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    # Prevent infinite loops: skip if push comes from our own bump commit
    if: "!contains(github.event.head_commit.message, 'chore(release)')"
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Bump version (patch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # No git tag; just update package.json version.
          npm version patch --no-git-tag-version

      - name: Create pull request for version bump
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(release): bump patch version"
          branch: "chore/version-bump"
          delete-branch: true
          title: "chore(release): bump patch version"
          body: |
            Auto-generated patch version bump from `master` push.
            This PR updates `package.json` version using `npm version patch --no-git-tag-version`.
          add-paths: |
            package.json

      - name: Enable auto-merge on version bump PR
        if: ${{ steps.cpr.outputs.pull-request-number }}
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash

